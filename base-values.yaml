auth:
  tokenAuth:
    enabled: true

features:
  fileRecoverySessionCR: true
  vmBasedSelection: true

global:
  urlScheme: https

prometheus:
  enabled: true
  server:
    enabled: true
    persistentVolume:
      enabled: true
      size: 8Gi
      storageClass: {{storageClass}}

extraVolumes:
  - name: runtime-writable
    emptyDir: {}

extraVolumeMounts:
  - name: runtime-writable
    mountPath: /var
  - name: runtime-writable
    mountPath: /tmp

